<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulir Pendaftaran — PROTIC Oprec 2026/2027</title>

    <!-- SEO Meta -->
    <meta name="description" content="Isi formulir pendaftaran Pengurus PROTIC Politeknik Negeri Cilacap 2026/2027. Pilih divisi sesuai minat dan kirim datamu." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://oprec.protic.web.id/form.html" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://oprec.protic.web.id/form.html" />
    <meta property="og:title" content="Formulir Pendaftaran — PROTIC Oprec 2026/2027" />
    <meta property="og:description" content="Isi formulir pendaftaran Pengurus PROTIC Politeknik Negeri Cilacap 2026/2027." />
    <meta property="og:image" content="https://oprec.protic.web.id/img/Protic.png" />
    <meta property="og:site_name" content="PROTIC Oprec" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Preload Critical Assets -->
    <link rel="preload" as="image" href="img/header.png" type="image/png" />

    <link rel="stylesheet" href="form.css" />
  </head>
  <body>
    <section class="registration-section">
      <header class="header">
        <img src="img/header.png" alt="PROTIC Header" class="header-image" width="334" height="147" fetchpriority="high" />
      </header>

      <div class="form-title-section">
        <h2 class="form-title">FORMULIR PENDAFTARAN</h2>
        <p class="form-subtitle">Pengurus Protic tahun 2026/2027</p>
        <div class="form-divider"></div>
      </div>

      <form id="registrationForm" class="registration-form">
        <!-- BIODATA -->
        <div class="form-section">
          <div class="section-header">
            <h3 class="section-title">BIODATA</h3>
          </div>

          <div class="form-group">
            <label for="fullname" class="form-label">Nama Lengkap</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              class="form-input"
              placeholder="Masukkan nama lengkap"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="npm" class="form-label">NPM/NIM</label>
            <input
              type="text"
              id="npm"
              name="npm"
              class="form-input"
              inputmode="numeric"
              pattern="[0-9]+"
              placeholder="Contoh: 230102001"
              autocomplete="off"
              required
            />
          </div>

          <div class="form-group">
            <label for="class" class="form-label">Kelas</label>
            <input
              type="text"
              id="class"
              name="class"
              class="form-input"
              placeholder="Contoh: TI-2A"
              autocomplete="off"
              required
            />
          </div>

          <div class="form-group">
            <label for="semester" class="form-label">Semester</label>
            <input
              type="number"
              id="semester"
              name="semester"
              class="form-input"
              min="1"
              max="8"
              placeholder="Contoh: 2"
              autocomplete="off"
              required
            />
          </div>
        </div>

        <!-- PILIHAN DIVISI -->
        <div class="form-section">
          <div class="section-header">
            <h3 class="section-title">PILIHAN DIVISI</h3>
          </div>
          <p class="division-instruction">
            Pilih 2 Divisi yang sesuai dengan minat dan bakatmu!
          </p>

          <div class="division-grid">
            <button type="button" class="division-btn" data-division="WEB">
              <img
                src="img/icon/web.svg"
                alt="Web Icon"
                width="30"
                height="30"
                loading="lazy"
              />
              WEB
            </button>
            <button type="button" class="division-btn" data-division="UI/UX">
              <img
                src="img/icon/ui.svg"
                alt="UI/UX Icon"
                width="30"
                height="30"
                loading="lazy"
              />
              UI/UX
            </button>
            <button type="button" class="division-btn" data-division="MOBILE">
              <img
                src="img/icon/mobile.svg"
                alt="Mobile Icon"
                width="30"
                height="30"
                loading="lazy"
              />
              MOBILE
            </button>
            <button type="button" class="division-btn" data-division="DEVOPS">
              <img
                src="img/icon/devops.svg"
                alt="DevOps Icon"
                width="30"
                height="30"
                loading="lazy"
              />
              DEVOPS
            </button>
            <button type="button" class="division-btn" data-division="DATA">
              <img
                src="img/icon/data.svg"
                alt="Data Icon"
                width="30"
                height="30"
                loading="lazy"
              />
              DATA
            </button>
            <button type="button" class="division-btn" data-division="HUMAS">
              <img
                src="img/icon/humas.svg"
                alt="Public Relations Icon"
                width="30"
                height="30"
                loading="lazy"
              />
              HUMAS
            </button>
            <!-- <button
              type="button"
              class="division-btn"
              data-division="SEKRETARIS"
            >
              <img
                src="img/icon/sekretaris.svg"
                alt="Secretary Icon"
                width="30"
                height="30"
                loading="lazy"
              />
              SEKRETARIS
            </button> -->
            <button type="button" class="division-btn" data-division="KOMINFO">
              <img
                src="img/icon/kominfo.svg"
                alt="Communication Icon"
                width="30"
                height="30"
                loading="lazy"
              />
              KOMINFO
            </button>
            <!-- <button
              type="button"
              class="division-btn"
              data-division="BENDAHARA"
            > 
             <img
                src="img/icon/bendahara.svg"
                alt="Treasurer Icon"
                width="30"
                height="30"
                loading="lazy"
              />
              BENDAHARA
            </button> -->
          </div>
          <div
            id="divisionError"
            class="division-error-msg hidden"
            role="alert"
            aria-live="polite"
          ></div>
        </div>

        <!-- BERKAS -->
        <div class="form-section">
          <div class="section-header">
            <h3 class="section-title">BERKAS</h3>
          </div>

          <div class="form-group">
            <label for="portfolio" class="form-label">Portofolio / CV</label>
            <input
              type="url"
              id="portfolio"
              name="portfolio"
              class="form-input"
              placeholder="https://drive.google.com/your-portfolio-link"
            />
          </div>

          <div class="form-group">
            <label for="whatsapp" class="form-label">Nomor Whatsapp</label>
            <input
              type="tel"
              id="whatsapp"
              name="whatsapp"
              class="form-input"
              inputmode="tel"
              pattern="[0-9]+"
              placeholder="08xxxxxxxxx"
              autocomplete="tel"
              required
            />
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email Aktif</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="nama@email.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-divider"></div>

          <button type="submit" id="submitBtn" class="submit-btn">
            <span id="btnText">Kirim</span>
            <span id="btnLoading" class="hidden">
              <svg
                class="spinner"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="path"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 
                    0 5.373 0 12h4zm2 5.291A7.962 
                    7.962 0 014 12H0c0 3.042 1.135 
                    5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
              Memproses...
            </span>
          </button>
        </div>
      </form>

      <footer class="footer">
        <div class="footer-content">
          <div class="footer-main">
            <div class="footer-logo">
              <img
                src="img/Protic.png"
                alt="PROTIC Logo"
                width="85"
                height="95"
                loading="lazy"
              />
            </div>
            <div class="footer-text">
              <h3 class="footer-title">PROTIC</h3>
              <p class="footer-subtitle">
                Programming Technology Informatics Club
              </p>
            </div>
          </div>
          <div class="footer-divider"></div>
          <div class="flex flex-row md:flex-col gap-2">
            <a href="https://github.com/Protic-PNC" aria-label="Github"
              ><img
                src="img/icon/github.svg"
                alt="GitHub"
                class="w-[20px] h-[20px]"
                width="20"
                height="20"
                loading="lazy"
            /></a>
            <a
              href="https://www.instagram.com/protic_pnc?stkn=anlzMDhlMzlucmJh"
              aria-label="Instagram"
              ><img
                src="img/icon/instagram.svg"
                alt="Instagram"
                class="w-[20px] h-[20px]"
                width="20"
                height="20"
                loading="lazy"
            /></a>
            <a
              href="https://www.linkedin.com/company/proticpnc/"
              aria-label="Linkedin"
              ><img
                src="img/icon/linkedin.svg"
                alt="LinkedIn"
                class="w-[20px] h-[20px]"
                width="20"
                height="20"
                loading="lazy"
            /></a>
          </div>
        </div>
        <p class="footer-copyright">© 2026 Protic | All Right Reserved</p>
      </footer>
    </section>

    <!-- SCRIPT -->
    <script>
      const scriptURL =
        "https://script.google.com/macros/s/AKfycbwIQSXMYo9amj9RHuLhKVcUNThJNoF2sn64q2GhZekD0nsCh4cCO5tcO0MrxMygBV-Z/exec";
      const form = document.getElementById("registrationForm");

      let selectedDivisions = [];
      const divisionError = document.getElementById("divisionError");

      function showDivisionError(msg) {
        if (divisionError) {
          divisionError.textContent = msg;
          divisionError.classList.remove("hidden");
        }
      }

      function clearDivisionError() {
        if (divisionError) {
          divisionError.textContent = "";
          divisionError.classList.add("hidden");
        }
      }

      document.querySelectorAll(".division-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const division = btn.dataset.division;

          if (selectedDivisions.includes(division)) {
            // batalin pilihan
            selectedDivisions = selectedDivisions.filter((d) => d !== division);
            btn.classList.remove("active");
            btn.classList.remove("selected");
            clearDivisionError();
          } else {
            if (selectedDivisions.length < 2) {
              selectedDivisions.push(division);
              btn.classList.add("active");
              btn.classList.add("selected");
              clearDivisionError();
            } else {
              showDivisionError("Kamu hanya boleh memilih maksimal 2 divisi!");
            }
          }
        });
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        if (selectedDivisions.length !== 2) {
          showDivisionError("Harap pilih tepat 2 divisi sebelum mengirim formulir!");
          divisionError.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }

        const formData = {
          fullname: form.fullname.value,
          npm: form.npm.value,
          class: form.class.value,
          semester: form.semester.value,
          division1: selectedDivisions[0],
          division2: selectedDivisions[1],
          portfolio: form.portfolio.value,
          whatsapp: form.whatsapp.value,
          email: form.email.value,
        };

        setLoading(true); // aktifkan loading

        fetch(scriptURL, {
          method: "POST",
          body: JSON.stringify(formData),
        })
          .then((res) => res.json())
          .then((data) => {
            window.location.href = "thankyou.html";
          })
          .catch((err) => {
            console.error("Error!", err.message);
            alert("Terjadi kesalahan, coba lagi!");
          })
          .finally(() => {
            setLoading(false); // matikan loading kalau gagal
          });
      });

      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const btnLoading = document.getElementById("btnLoading");

      function setLoading(loading) {
        if (loading) {
          submitBtn.disabled = true;
          btnText.classList.add("hidden");
          btnLoading.classList.remove("hidden");
        } else {
          submitBtn.disabled = false;
          btnText.classList.remove("hidden");
          btnLoading.classList.add("hidden");
        }
      }
    </script>
  </body>
</html>
