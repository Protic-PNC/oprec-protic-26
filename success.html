  <script>
    // Validasi token keamanan & expiry sessionStorage (U-20)
    function generateSecurityToken(npm, status, timestamp) {
      const secretSalt = "PROTIC_OPREC_2026_SECURITY_SALT_v1";
      const payload = String(npm).trim() + "|" + String(status).toLowerCase().trim() + "|" + timestamp + "|" + secretSalt;
      let hash = 5381;
      for (let i = 0; i < payload.length; i++) {
        hash = ((hash << 5) + hash) + payload.charCodeAt(i);
        hash = hash & hash;
      }
      let hash2 = 0x811c9dc5;
      for (let i = 0; i < payload.length; i++) {
        hash2 ^= payload.charCodeAt(i);
        hash2 = Math.imul(hash2, 0x01000193);
      }
      return ((hash >>> 0).toString(16).padStart(8, "0") + (hash2 >>> 0).toString(16).padStart(8, "0"));
    }

    const MAX_SESSION_AGE = 15 * 60 * 1000; // 15 menit
    let studentData = null;
    let authError = null;

    try {
      const raw = sessionStorage.getItem("studentData");
      if (!raw) {
        authError = "Sesi Tidak Ditemukan";
      } else {
        const parsed = JSON.parse(raw);
        // Cek struktur payload
        if (!parsed || !parsed.data || !parsed.timestamp || !parsed.token) {
          authError = "Format Sesi Tidak Valid";
        } else {
          const now = Date.now();
          const age = now - parsed.timestamp;

          if (age > MAX_SESSION_AGE || parsed.timestamp > now + 60000) {
            authError = "Sesi Telah Berakhir (Kedaluwarsa)";
            sessionStorage.removeItem("studentData");
          } else {
            const expectedToken = generateSecurityToken(
              parsed.data.NPM,
              parsed.data.Status,
              parsed.timestamp
            );

            if (expectedToken !== parsed.token) {
              authError = "Integritas Sesi Tidak Valid";
              sessionStorage.removeItem("studentData");
            } else if (!parsed.data.Status || parsed.data.Status.toLowerCase() !== "diterima") {
              authError = "Status Kelolosan Tidak Sesuai";
              sessionStorage.removeItem("studentData");
            } else {
              studentData = parsed.data;
            }
          }
        }
      }
    } catch (e) {
      console.error("Gagal membaca atau memverifikasi studentData:", e);
      authError = "Terjadi Kesalahan Pembacaan Sesi";
    }

    const namaEl = document.getElementById("studentName");
    const divisiEl = document.getElementById("studentDivision");
    const infoEl = document.getElementById("studentInfo");
    const groupBtn = document.getElementById("groupBtn");

    if (!studentData || !studentData.Nama || !studentData.Divisi) {
      if (namaEl) namaEl.textContent = authError || "Data Tidak Ditemukan";
      if (divisiEl) divisiEl.textContent = "Akses Dibatasi";
      if (infoEl) {
        infoEl.innerHTML = `
          <div class="flex flex-col items-center gap-2 leading-relaxed">
            <p class="text-[14px] text-textgray">
              ${authError === "Sesi Telah Berakhir (Kedaluwarsa)"
                ? "Sesi pengumuman Anda telah berakhir demi alasan keamanan (maks. 15 menit)."
                : "Silakan periksa status kelolosan Anda secara resmi melalui halaman pengumuman."}
            </p>
            <a href="pengumuman.html" class="text-lightergreen underline font-medium hover:text-white mt-1">Kembali ke Pengumuman</a>
          </div>
        `;
      }
      if (groupBtn) {
        groupBtn.textContent = "Ke Halaman Pengumuman";
        groupBtn.addEventListener("click", () => {
          window.location.href = "pengumuman.html";
        });
      }
    } else {
      // Isi nama & divisi
      namaEl.textContent = studentData.Nama;
      // Tampilan nama posisi/divisi yang rapi
      const isCoreRole =
        studentData.Divisi.toUpperCase() === "SEKRETARIS" ||
        studentData.Divisi.toUpperCase() === "SEKRE" ||
        studentData.Divisi.toUpperCase() === "BENDAHARA";
      const displayRole = isCoreRole ? studentData.Divisi : `Divisi ${studentData.Divisi}`;

      divisiEl.textContent = displayRole;

      // Ubah isi info agar lebih rapi dan proporsional
      infoEl.innerHTML = `
        <div class="flex flex-col items-center gap-2 leading-relaxed">
          <p class="text-[15px]">Anda resmi bergabung sebagai</p>
          <p class="text-[18px] font-semibold text-lightgreen">${displayRole} PROTIC 2026/2027</p>
          <p class="text-[14px] mt-2 text-textgray">Terima kasih telah menjadi bagian dari kami.</p>
          <p class="text-[14px] text-textgray">Klik tombol di bawah untuk menghubungi koordinator!</p>
        </div>
      `;

      // Kontak koordinator berdasarkan divisi/posisi
      const divisionContacts = {
        DATA: "6288802660915",
        DEVOPS: "6285869592005",
        HUMAS: "62882008288696",
        KOMINFO: "6285974088420",
        MOBILE: "6285173384560",
        "UI/UX": "6288237169266",
        WEB: "62895384922113",
        SEKRETARIS: "6285727669488",
        SEKRE: "6285727669488",
        BENDAHARA: "6285777269126",
      };

      const normalizedDivisi = String(studentData.Divisi || "").toUpperCase().trim();
      const phone = divisionContacts[normalizedDivisi];

      if (phone) {
        const textLines = [
          "Halo Kak! Sebelumnya perkenalkan, saya",
          "",
          `Nama   : ${studentData.Nama}`,
          `NPM    : ${studentData.NPM || "-"}`,
          `Divisi : ${studentData.Divisi}`,
          "",
          `Saya sudah dinyatakan DITERIMA sebagai Pengurus Protic 2026/2027 pada divisi ${studentData.Divisi}.`,
          "Mohon arahan lebih lanjut, Kak. Terima kasih 🙏🏻",
        ];
        const messageText = textLines.join("\n");
        const cleanPhone = String(phone).replace(/\D/g, "");
        const waLink = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(messageText)}`;

        groupBtn.addEventListener("click", () => window.open(waLink, "_blank"));
      } else {
        groupBtn.disabled = true;
        groupBtn.textContent = "Kontak Belum Tersedia";
        groupBtn.classList.add("opacity-50", "cursor-not-allowed");
      }
    }
