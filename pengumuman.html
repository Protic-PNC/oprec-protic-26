  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbw_mtEcU_vVhF96O2ACQZkPp_LoV7i88L9b4CNFx5gLkJ9wSiSzBtaA6xkNitoZ-aPo/exec";

    const submitBtn = document.getElementById("submit");
    const npmInput = document.getElementById("npm");

    // Ambil data dari API
    async function fetchStudentData(npm) {
      const res = await fetch(`${API_URL}?npm=${encodeURIComponent(npm)}`);

      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch {
        throw new Error("Respons bukan JSON: " + text.slice(0, 200));
      }

      if (!res.ok || data.ok === false) {
        throw new Error(data?.error || `HTTP ${res.status}`);
      }

      return data;
    }

    function generateSecurityToken(npm, status, timestamp) {
      const secretSalt = "PROTIC_OPREC_2026_SECURITY_SALT_v1";
      const payload = String(npm).trim() + "|" + String(status).toLowerCase().trim() + "|" + timestamp + "|" + secretSalt;
      let hash = 5381;
      for (let i = 0; i < payload.length; i++) {
        hash = ((hash << 5) + hash) + payload.charCodeAt(i);
        hash = hash & hash;
      }
      let hash2 = 0x811c9dc5;
      for (let i = 0; i < payload.length; i++) {
        hash2 ^= payload.charCodeAt(i);
        hash2 = Math.imul(hash2, 0x01000193);
      }
      return ((hash >>> 0).toString(16).padStart(8, "0") + (hash2 >>> 0).toString(16).padStart(8, "0"));
    }

    // Saat tombol diklik
    submitBtn.addEventListener("click", async () => {
      const npm = npmInput.value.trim();

      if (!npm) {
        alert("Masukkan NPM terlebih dahulu!");
        return;
      }

      try {
        const result = await fetchStudentData(npm);

        if (!result.data) {
          alert("❌ NPM tidak ditemukan di data pengurus!");
          return;
        }

        // Ambil data sesuai nama kolom di spreadsheet
        const nim = (result.data.NPM || npm).toString().trim();
        const nama = result.data.Nama;
        const divisi = result.data.Divisi;
        const status = (result.data.Status || "").toString().trim();

        // Buat timestamp & token keamanan (U-20 hardening)
        const timestamp = Date.now();
        const token = generateSecurityToken(nim, status, timestamp);

        const sessionPayload = {
          data: {
            ...result.data,
            NPM: nim,
            Nama: nama,
            Divisi: divisi,
            Status: status
          },
          timestamp,
          token
        };

        // Simpan ke sessionStorage dengan token & timestamp
        sessionStorage.setItem("studentData", JSON.stringify(sessionPayload));

        // Arahkan ke halaman sesuai status
        if (status && status.toLowerCase() === "diterima") {
          window.location.href = "success.html";
        } else {
          window.location.href = "denied.html";
        }
      } catch (err) {
        console.error(err);
        alert("Terjadi kesalahan: " + err.message);
      }
    });
  </script>
